# 외부 키와 .env 없이 격리 DB에서 테스트합니다.
spring:
  # 일반 테스트는 Hibernate로 테이블을 만들고, Flyway SQL은 FlywayMigrationTest가 따로 검증합니다.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
  # HTTP fixture에는 /actuator/health가 없으므로 상태 확인 대신 기본 인스턴스 목록을 씁니다.
  cloud:
    loadbalancer:
      configurations: default
eureka:
  client:
    enabled: false
notification:
  clients:
    scheme: http
  consumer-enabled: false
  worker-enabled: false
  push:
    enabled: false
springdoc:
  api-docs:
    enabled: true
