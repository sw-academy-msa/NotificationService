# Notification은 자신의 DB와 스키마만 소유합니다.
spring:
  application:
    name: notification-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: notification
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
    admin:
      auto-create: false
server:
  port: ${SERVER_PORT:8087}
  forward-headers-strategy: none
notification:
  business-consumer-enabled: ${NOTIFICATION_BUSINESS_CONSUMER_ENABLED:false}
  business:
    push-max-age: ${NOTIFICATION_BUSINESS_PUSH_MAX_AGE:7d}
  consumer-enabled: ${NOTIFICATION_CONSUMER_ENABLED:false}
  worker-enabled: ${NOTIFICATION_WORKER_ENABLED:false}
  auth:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: ${JWT_AUDIENCE:stockdrop-api}
    jwk-set-uri: ${ACCOUNT_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
  clients:
    account: ${ACCOUNT_INTERNAL_URL:http://localhost:8080}
    ai: ${AI_INTERNAL_URL:http://localhost:8086}
    product-query: ${PRODUCT_QUERY_INTERNAL_URL:http://localhost:8082}
    client-secret: ${NOTIFICATION_CLIENT_SECRET:}
    service-subject: ${NOTIFICATION_SERVICE_SUBJECT:}
  push:
    enabled: ${WEB_PUSH_ENABLED:false}
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:}
    encryption-key: ${PUSH_ENCRYPTION_KEY:}
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    hostname: ${SERVICE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${SERVICE_INSTANCE_ID:${random.uuid}}
    non-secure-port: ${SERVICE_PORT:${server.port}}
    health-check-url-path: /actuator/health
management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 업무 JWT와 분리된 읽기 전용 수집 토큰입니다. 빈 값이면 메트릭 접근을 거부합니다.
monitoring:
  scrape-token: ${MONITORING_SCRAPE_TOKEN:}
