# Notification은 자신의 DB와 스키마만 소유합니다.
spring:
  application:
    name: notification-service
  profiles:
    default: local
  # 테이블 변경은 db/migration의 버전 SQL로 관리합니다.
  flyway:
    locations: classpath:db/migration
    default-schema: notification
    schemas: notification
    create-schemas: true
  # 내부 호출 장애 대응입니다. 상태 확인으로 죽은 인스턴스를 목록에서 미리 빼고, 연결 자체가 실패한 요청만 다른 인스턴스로 1회 재시도합니다.
  # 연결 실패는 요청이 상대에 도달하지 않은 경우라 토큰 발급(POST)도 중복 없이 재시도할 수 있습니다. 응답 지연은 재시도하지 않습니다.
  cloud:
    loadbalancer:
      configurations: health-check
      health-check:
        # 메일·DB 같은 외부 연결 검사가 들어간 /actuator/health 대신 인스턴스 기동 여부만 보는 readiness를 씁니다.
        # 전체 health를 10초마다 호출하면 Account의 메일 검사가 SMTP에 반복 로그인해 차단되고 인스턴스가 통째로 제외됩니다.
        path:
          default: /actuator/health/readiness
        interval: 10s
        refetch-instances: true
        refetch-instances-interval: 30s
      retry:
        enabled: true
        retry-on-all-operations: true
        max-retries-on-same-service-instance: 0
        max-retries-on-next-service-instance: 1
        retryable-exceptions: java.net.ConnectException, java.net.http.HttpConnectTimeoutException
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: notification
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
    admin:
      auto-create: false
server:
  port: ${SERVER_PORT:8087}
  forward-headers-strategy: none
notification:
  business-consumer-enabled: ${NOTIFICATION_BUSINESS_CONSUMER_ENABLED:false}
  business:
    push-max-age: ${NOTIFICATION_BUSINESS_PUSH_MAX_AGE:7d}
  consumer-enabled: ${NOTIFICATION_CONSUMER_ENABLED:false}
  worker-enabled: ${NOTIFICATION_WORKER_ENABLED:false}
  auth:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: ${JWT_AUDIENCE:stockdrop-api}
    jwk-set-uri: ${ACCOUNT_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
  # 내부 호출 대상은 Eureka 서비스 ID입니다. 고정 주소를 두지 않아 장애 인스턴스를 등록 해제로 우회합니다.
  clients:
    # 서비스 토큰과 동의 정보가 오가므로 기본 https입니다. 평문 http는 로컬·테스트 프로필에서만 허용합니다.
    scheme: https
    account: account-service
    ai: ai-service
    product-query: product-query-service
    client-secret: ${NOTIFICATION_CLIENT_SECRET:}
    service-subject: ${NOTIFICATION_SERVICE_SUBJECT:}
  push:
    enabled: ${WEB_PUSH_ENABLED:false}
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:}
    encryption-key: ${PUSH_ENCRYPTION_KEY:}
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    hostname: ${SERVICE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${SERVICE_INSTANCE_ID:${random.uuid}}
    non-secure-port: ${SERVICE_PORT:${server.port}}
    health-check-url-path: /actuator/health
management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 업무 JWT와 분리된 읽기 전용 수집 토큰입니다. 빈 값이면 메트릭 접근을 거부합니다.
monitoring:
  scrape-token: ${MONITORING_SCRAPE_TOKEN:}
