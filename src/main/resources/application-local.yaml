# .env는 로컬에서만 읽습니다. 실제 비밀번호는 저장소에 포함하지 않습니다.
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/notification_service}
    username: ${DB_USERNAME:notification}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  flyway:
    # Flyway 도입 전 update로 만든 기존 개발 DB는 V1을 실행하지 않고 적용된 것으로 기록합니다. 빈 DB에서는 V1부터 실행합니다.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: update
notification:
  clients:
    # 로컬 프로필에서만 내부 서비스를 평문 http로 호출합니다.
    scheme: http
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
