# PR과 main/develop 변경 시 Java 21 및 Docker가 있는 실행 환경에서 테스트합니다.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # CI에는 실제 푸시 키와 서비스 비밀값을 주입하지 않습니다.
    env:
      NOTIFICATION_CONSUMER_ENABLED: 'false'
      WEB_PUSH_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      # Testcontainers가 격리 PostgreSQL과 Kafka를 준비하며 실제 Apple 전송 없이 검증합니다.
      - name: Run tests and build executable JAR
        run: ./gradlew clean test bootJar --no-daemon

      # 실패한 테스트를 확인할 수 있도록 HTML 보고서를 보관합니다.
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
